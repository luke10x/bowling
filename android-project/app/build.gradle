plugins {
    id 'com.android.application'   // MUST have this for 'android { }' block
}

android {
    namespace "org.libsdl.app"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.bigjump"

        // Local builds use Google's sample ads; release overrides these below.
        resValue 'string', 'admob_app_id',
            (project.findProperty('ADMOB_ANDROID_APP_ID') ?: 'ca-app-pub-3940256099942544~3347511713')
        resValue 'string', 'admob_loss_unit',
            (project.findProperty('ADMOB_ANDROID_LOSS_UNIT') ?: 'ca-app-pub-3940256099942544/1033173712')

        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        // 👇 This makes sure libc++_shared.so is packaged into the APK
            externalNativeBuild {
                ndkBuild {
                    arguments "APP_STL=c++_shared"
                    // if you were using old NDK r17 or earlier, could be:
                    // arguments "APP_STL=gnustl_shared"
                }
            }
    }

    sourceSets {
        main {
//            assets.srcDirs += ["../../assets"]
            assets.srcDirs = [
                    file("../../assets"),
                    file("src/main/assets")
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    buildTypes {
        release {
            resValue 'string', 'admob_app_id',
                (project.findProperty('ADMOB_ANDROID_APP_ID') ?: 'ca-app-pub-2747257038106344~4817748726')
            resValue 'string', 'admob_loss_unit',
                (project.findProperty('ADMOB_ANDROID_LOSS_UNIT') ?: 'ca-app-pub-2747257038106344/9125404259')
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Installable performance build: release native optimization with local debug signing.
        benchmark {
            initWith release
            // This installable performance build is also used for local testing.
            resValue 'string', 'admob_app_id', 'ca-app-pub-3940256099942544~3347511713'
            resValue 'string', 'admob_loss_unit', 'ca-app-pub-3940256099942544/1033173712'
            signingConfig signingConfigs.debug
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }
    lint {
        abortOnError false
    }

}

// The local benchmark APK does not need release lint, which may require an
// uncached lint plugin when building offline. Keep normal release lint intact.
tasks.configureEach {
    if (name.startsWith('lintVital') && name.endsWith('Benchmark')) {
        enabled = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // v23 keeps the game's Android 5 (API 21) minimum while adding AdMob.
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
