plugins {
    id 'com.android.application'   // MUST have this for 'android { }' block
}

// Read the C++ source of truth directly; Android Studio and Gradle need no
// separate key file or manual sync step.
def adsConfig = [:]
file('../../ads_config.h').eachLine { line ->
    def match = line =~ /^#define\s+(ADS_[A-Z0-9_]+)\s+"([^"]+)"\s*$/
    if (match.matches()) adsConfig[match[0][1]] = match[0][2]
}
[
    'ADS_ANDROID_APP_ID', 'ADS_ANDROID_INTERSTITIAL_ID', 'ADS_ANDROID_REWARDED_ID',
    'ADS_TEST_ANDROID_APP_ID', 'ADS_TEST_ANDROID_INTERSTITIAL_ID', 'ADS_TEST_ANDROID_REWARDED_ID'
].each { key ->
    if (!adsConfig[key]) throw new GradleException("Missing ${key} in ads_config.h")
}

android {
    namespace "org.libsdl.app"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.bigjump"

        // Local builds use Google's sample ads; release overrides these below.
        resValue 'string', 'admob_app_id', adsConfig.ADS_TEST_ANDROID_APP_ID
        resValue 'string', 'admob_loss_unit', adsConfig.ADS_TEST_ANDROID_INTERSTITIAL_ID
        resValue 'string', 'admob_rewarded_unit', adsConfig.ADS_TEST_ANDROID_REWARDED_ID

        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        // 👇 This makes sure libc++_shared.so is packaged into the APK
            externalNativeBuild {
                ndkBuild {
                    arguments "APP_STL=c++_shared"
                    // if you were using old NDK r17 or earlier, could be:
                    // arguments "APP_STL=gnustl_shared"
                }
            }
    }

    sourceSets {
        main {
//            assets.srcDirs += ["../../assets"]
            assets.srcDirs = [
                    file("../../assets"),
                    file("src/main/assets")
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
    buildTypes {
        release {
            resValue 'string', 'admob_app_id', adsConfig.ADS_ANDROID_APP_ID
            resValue 'string', 'admob_loss_unit', adsConfig.ADS_ANDROID_INTERSTITIAL_ID
            resValue 'string', 'admob_rewarded_unit', adsConfig.ADS_ANDROID_REWARDED_ID
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Installable performance build: release native optimization with local debug signing.
        benchmark {
            initWith release
            // This installable performance build is also used for local testing.
            resValue 'string', 'admob_app_id', adsConfig.ADS_TEST_ANDROID_APP_ID
            resValue 'string', 'admob_loss_unit', adsConfig.ADS_TEST_ANDROID_INTERSTITIAL_ID
            resValue 'string', 'admob_rewarded_unit', adsConfig.ADS_TEST_ANDROID_REWARDED_ID
            signingConfig signingConfigs.debug
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }
    lint {
        abortOnError false
    }

}

// The local benchmark APK does not need release lint, which may require an
// uncached lint plugin when building offline. Keep normal release lint intact.
tasks.configureEach {
    if (name.startsWith('lintVital') && name.endsWith('Benchmark')) {
        enabled = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // v23 keeps the game's Android 5 (API 21) minimum while adding AdMob.
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
