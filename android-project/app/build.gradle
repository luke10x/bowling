plugins {
    id 'com.android.application'   // MUST have this for 'android { }' block
}

android {
    namespace "org.libsdl.app"
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.bigjump"

        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        // 👇 This makes sure libc++_shared.so is packaged into the APK
            externalNativeBuild {
                ndkBuild {
                    arguments "APP_STL=c++_shared"
                    // if you were using old NDK r17 or earlier, could be:
                    // arguments "APP_STL=gnustl_shared"
                }
            }
    }
    // externalNativeBuild {
    //     ndkBuild {
    //         path "jni/src/Android.mk"
    //         buildStagingDirectory file("/Users/lape/workspace/bowling/3rdparty")
    //     }
    // }
        externalNativeBuild {
        cmake {
//            version "3.27.0" // As required by clay

            path "CMakeLists.txt"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
