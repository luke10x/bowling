# Minigame baked animation cache config.
# Format:
#   sample <seconds_per_cached_frame>
#   anim <assman_anim_blob> <GeneratedName> <generatedVariablePrefix>
#
# Regular game characters still use runtime skeleton solving. These cached
# frames are for miniature minigame crowds where many instances share clips.
sample 0.10

anim assets/assman_out/angel.anim Angel miniGameAngelAnim
anim assets/assman_out/cherub.anim Cherub miniGameCherubAnim
anim assets/assman_out/seraph.anim Seraph miniGameSeraphAnim
anim assets/assman_out/throne.anim Throne miniGameThroneAnim
