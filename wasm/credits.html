<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bowling Credits</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #12171c;
      color: #f5f1e8;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(680px, calc(100vw - 32px));
      padding: 32px 0;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 7vw, 4rem);
      letter-spacing: 0;
    }
    p {
      margin: 12px 0;
      color: #d8d0c4;
      font-size: 1.05rem;
      line-height: 1.55;
    }
    a {
      color: #79d0ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Bowling Credits</h1>
    <p>Created with love, stubbornness, and a suspicious amount of lane oil.</p>
    <p>Built on SDL, OpenGL ES, Clay, GLM, and the rest of the project dependencies.</p>
    <p><a href="https://github.com/luke10x/bowling">Project source</a></p>
  </main>
</body>
</html>
