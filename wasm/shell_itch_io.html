<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#1c2030">
        <link rel="manifest" href="manifest.json">
        <title>Fulscreener</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: stretch;
                align-items: stretch;
                background-color: red; /* For visibility */
                overflow: hidden;
            }
            #canvas {
                flex: 1 0;
                height: 100%;
                background-color: #529e68; /* For visibility */
            }

            /* FAB Button */
            #fab-btn {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background-color: rgba(100, 100, 100, 0.7);
                color: white;
                font-size: 24px;
                border: none;
                cursor: pointer;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #fab-btn:hover {
                background-color: rgba(150, 150, 150, 0.9);
            }

            /* Logs Overlay Panel */
            #logs-panel {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.85);
                z-index: 999;
                flex-direction: column;
            }
            #logs-panel.active {
                display: flex;
            }
            #logs-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                background-color: #333;
                color: white;
                border-bottom: 1px solid #555;
            }
            #logs-header h3 {
                margin: 0;
                font-size: 18px;
            }
            #close-logs-btn {
                background: none;
                border: none;
                color: white;
                font-size: 28px;
                cursor: pointer;
                padding: 0 10px;
            }
            #close-logs-btn:hover {
                color: #ff6666;
            }
            #logs-container {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                color: #0f0;
                background-color: #111;
            }
            #logs-container .log-line {
                margin-bottom: 4px;
                word-wrap: break-word;
                white-space: pre-wrap;
            }
            #logs-container .log-stdout {
                color: #0f0;
            }
            #logs-container .log-stderr {
                color: #ff6666;
            }
            #logs-container .log-status {
                color: #6699ff;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex=-1></canvas>

        <!-- FAB Button -->
        <button id="fab-btn" title="Open Logs">📋</button>

        <!-- Logs Overlay Panel -->
        <div id="logs-panel">
            <div id="logs-header">
                <h3>📜 Console Logs</h3>
                <button id="close-logs-btn">&times;</button>
            </div>
            <div id="logs-container"></div>
        </div>

        <script type='text/javascript'>
            var logsContainer = document.getElementById('logs-container');
            var logsPanel = document.getElementById('logs-panel');
            var fabBtn = document.getElementById('fab-btn');
            var closeLogsBtn = document.getElementById('close-logs-btn');

            // Toggle logs panel
            fabBtn.addEventListener('click', function() {
                logsPanel.classList.toggle('active');
            });

            closeLogsBtn.addEventListener('click', function() {
                logsPanel.classList.remove('active');
            });

            // Helper to add log line
            function addLog(message, type) {
                var line = document.createElement('div');
                line.className = 'log-line ' + type;
                line.textContent = message;
                logsContainer.appendChild(line);
                // Auto-scroll to bottom
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            var Module = {
                print: (args) => {
                    console.log("STDOUT: " + args);
                    addLog(args, 'log-stdout');
                },
                printErr: (args) => {
                    console.warn("STDERR: " + args);
                    addLog(args, 'log-stderr');
                },
                canvas: document.getElementById('canvas'),
                setStatus: (text) => {
                    console.log("STATUS: " + text);
                    addLog(text, 'log-status');
                },
            }
            window.onerror = function(message, source, lineno, colno, error) {
                var errorMsg = "ERROR: " + message + " (line " + lineno + ", col " + colno + ")";
                console.error(errorMsg);
                addLog(errorMsg, 'log-stderr');
            }
        </script>
        <script>
            function setBoxSize() {
                console.log('resizing')
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                console.log({ratio: windowWidth / windowHeight});
            }
            setBoxSize();
            window.addEventListener('resize', setBoxSize);
        </script>

        <script>
            (function () {
                var overlayState = {};

                function removeOverlay(name) {
                    var existing = overlayState[name];
                    if (existing && existing.parentNode) {
                        existing.parentNode.removeChild(existing);
                    }
                    delete overlayState[name];
                }

                // Assumed signature for future customization:
                //   showGameOverlay(name, {
                //     title: 'Title text',
                //     text: 'Message body',
                //     buttons: [{ label, onClick }]
                //   })
                window.showGameOverlay = function (name, options) {
                    if (!name)
                        return;
                    removeOverlay(name);

                    options = options || {};

                    var overlay = document.createElement('div');
                    overlay.id = 'game-overlay-' + name;
                    overlay.style.cssText =
                        'position:fixed;left:0;top:0;right:0;bottom:0;' +
                        'display:flex;align-items:center;justify-content:center;' +
                        'background:rgba(0,0,0,0.62);z-index:2147483647;' +
                        'font-family:sans-serif;';

                    var panel = document.createElement('div');
                    panel.style.cssText =
                        'width:min(88vw,420px);padding:22px 20px 18px;border-radius:18px;' +
                        'background:#1e2436;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,0.45);' +
                        'text-align:center;';

                    if (options.title) {
                        var title = document.createElement('div');
                        title.textContent = options.title;
                        title.style.cssText = 'font-size:22px;font-weight:700;margin-bottom:12px;';
                        panel.appendChild(title);
                    }

                    if (options.text) {
                        var text = document.createElement('div');
                        text.textContent = options.text;
                        text.style.cssText = 'font-size:16px;line-height:1.45;margin-bottom:18px;color:rgba(255,255,255,0.9);';
                        panel.appendChild(text);
                    }

                    var buttonsRow = document.createElement('div');
                    buttonsRow.style.cssText = 'display:flex;gap:12px;justify-content:center;flex-wrap:wrap;';

                    var buttons = Array.isArray(options.buttons) ? options.buttons : [];
                    buttons.forEach(function (btnDef, index) {
                        var button = document.createElement('button');
                        button.type = 'button';
                        button.textContent = btnDef && btnDef.label ? btnDef.label : ('Button ' + (index + 1));
                        button.style.cssText =
                            'min-width:110px;padding:12px 18px;border:0;border-radius:12px;' +
                            'font-size:16px;font-weight:700;cursor:pointer;';
                        if (btnDef && btnDef.kind === 'primary') {
                            button.style.background = '#5d7cff';
                            button.style.color = '#fff';
                        } else if (btnDef && btnDef.kind === 'danger') {
                            button.style.background = '#c43c3c';
                            button.style.color = '#fff';
                        } else {
                            button.style.background = '#d9dde7';
                            button.style.color = '#1a1f2d';
                        }
                        button.onclick = function () {
                            if (btnDef && typeof btnDef.onClick === 'function') {
                                btnDef.onClick();
                            }
                            if (!btnDef || btnDef.closeOnClick !== false) {
                                removeOverlay(name);
                            }
                        };
                        buttonsRow.appendChild(button);
                    });

                    panel.appendChild(buttonsRow);
                    overlay.appendChild(panel);
                    document.body.appendChild(overlay);
                    overlayState[name] = overlay;
                    return overlay;
                };

                window.hideGameOverlay = function (name) {
                    removeOverlay(name);
                };

                window.__updatePromptState = {
                    visible: false,
                    dismissed: false,
                    reloadOnControllerChange: false,
                    registration: null
                };

                function showUpdatePrompt() {
                    var state = window.__updatePromptState;
                    if (state.dismissed || state.visible)
                        return;
                    if (!state.registration || !state.registration.waiting)
                        return;
                    if (!navigator.serviceWorker.controller)
                        return;

                    state.visible = true;
                    window.showGameOverlay('update-prompt', {
                        title: 'Update available',
                        text: 'A new version of the game is available. Update now?',
                        buttons: [
                            {
                                label: 'Update',
                                kind: 'primary',
                                onClick: function () {
                                    var waiting = state.registration && state.registration.waiting;
                                    if (waiting) {
                                        state.visible = false;
                                        window.hideGameOverlay('update-prompt');
                                        state.reloadOnControllerChange = true;
                                        waiting.postMessage({ type: 'SKIP_WAITING' });
                                    }
                                }
                            },
                            {
                                label: 'Dismiss',
                                onClick: function () {
                                    state.dismissed = true;
                                    state.visible = false;
                                    window.hideGameOverlay('update-prompt');
                                }
                            }
                        ]
                    });
                }

                function handleSWMessage(event) {
                    if (!event || !event.data || event.data.type !== 'NEW_VERSION_AVAILABLE')
                        return;
                    var state = window.__updatePromptState;
                    if (!state.registration && navigator.serviceWorker.controller)
                        state.registration = null;
                    showUpdatePrompt();
                }

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.addEventListener('message', handleSWMessage);
                    navigator.serviceWorker.addEventListener('controllerchange', function () {
                        var state = window.__updatePromptState;
                        if (state.reloadOnControllerChange) {
                            state.reloadOnControllerChange = false;
                            window.location.reload();
                        }
                    });

                    window.addEventListener('load', function () {
                        navigator.serviceWorker.register('sw.js').then(function (registration) {
                            window.__updatePromptState.registration = registration;

                            registration.addEventListener('updatefound', function () {
                                var installing = registration.installing;
                                if (!installing)
                                    return;
                                installing.addEventListener('statechange', function () {
                                    if (installing.state !== 'installed')
                                        return;
                                    if (!navigator.serviceWorker.controller)
                                        return;
                                    showUpdatePrompt();
                                });
                                if (installing.state === 'installed' && navigator.serviceWorker.controller)
                                    showUpdatePrompt();
                            });

                            if (registration.waiting && navigator.serviceWorker.controller) {
                                showUpdatePrompt();
                            }
                        }).catch(function (err) {
                            console.warn('Service worker registration failed:', err);
                        });
                    });
                }
            })();
        </script>

        {{{ SCRIPT }}}
    </body>
</html>
