<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fulscreener</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: stretch;
                align-items: stretch;
                background-color: red; /* For visibility */
                overflow: hidden;
            }
            #canvas {
                flex: 1 0;
                height: 100%;
                background-color: #529e68; /* For visibility */
            }

            /* FAB Button */
            #fab-btn {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background-color: rgba(100, 100, 100, 0.7);
                color: white;
                font-size: 24px;
                border: none;
                cursor: pointer;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #fab-btn:hover {
                background-color: rgba(150, 150, 150, 0.9);
            }

            /* Logs Overlay Panel */
            #logs-panel {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.85);
                z-index: 999;
                flex-direction: column;
            }
            #logs-panel.active {
                display: flex;
            }
            #logs-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                background-color: #333;
                color: white;
                border-bottom: 1px solid #555;
            }
            #logs-header h3 {
                margin: 0;
                font-size: 18px;
            }
            #close-logs-btn {
                background: none;
                border: none;
                color: white;
                font-size: 28px;
                cursor: pointer;
                padding: 0 10px;
            }
            #close-logs-btn:hover {
                color: #ff6666;
            }
            #logs-container {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                color: #0f0;
                background-color: #111;
            }
            #logs-container .log-line {
                margin-bottom: 4px;
                word-wrap: break-word;
                white-space: pre-wrap;
            }
            #logs-container .log-stdout {
                color: #0f0;
            }
            #logs-container .log-stderr {
                color: #ff6666;
            }
            #logs-container .log-status {
                color: #6699ff;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex=-1></canvas>

        <!-- FAB Button -->
        <button id="fab-btn" title="Open Logs">📋</button>

        <!-- Logs Overlay Panel -->
        <div id="logs-panel">
            <div id="logs-header">
                <h3>📜 Console Logs</h3>
                <button id="close-logs-btn">&times;</button>
            </div>
            <div id="logs-container"></div>
        </div>

        <script type='text/javascript'>
            var logsContainer = document.getElementById('logs-container');
            var logsPanel = document.getElementById('logs-panel');
            var fabBtn = document.getElementById('fab-btn');
            var closeLogsBtn = document.getElementById('close-logs-btn');

            // Toggle logs panel
            fabBtn.addEventListener('click', function() {
                logsPanel.classList.toggle('active');
            });

            closeLogsBtn.addEventListener('click', function() {
                logsPanel.classList.remove('active');
            });

            // Helper to add log line
            function addLog(message, type) {
                var line = document.createElement('div');
                line.className = 'log-line ' + type;
                line.textContent = message;
                logsContainer.appendChild(line);
                // Auto-scroll to bottom
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            var Module = {
                print: (args) => {
                    console.log("STDOUT: " + args);
                    addLog(args, 'log-stdout');
                },
                printErr: (args) => {
                    console.warn("STDERR: " + args);
                    addLog(args, 'log-stderr');
                },
                canvas: document.getElementById('canvas'),
                setStatus: (text) => {
                    console.log("STATUS: " + text);
                    addLog(text, 'log-status');
                },
            }
            window.onerror = function(message, source, lineno, colno, error) {
                var errorMsg = "ERROR: " + message + " (line " + lineno + ", col " + colno + ")";
                console.error(errorMsg);
                addLog(errorMsg, 'log-stderr');
            }
        </script>
        <script>
            function setBoxSize() {
                console.log('resizing')
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                console.log({ratio: windowWidth / windowHeight});
            }
            setBoxSize();
            window.addEventListener('resize', setBoxSize);
        </script>

        {{{ SCRIPT }}}
    </body>
</html>
