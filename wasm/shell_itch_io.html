<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#1c2030">
        <link rel="manifest" href="manifest.json">
        <link rel="icon" href="logo.svg" type="image/svg+xml">
        <title>Fulscreener</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: stretch;
                align-items: stretch;
                background-color: red; /* For visibility */
                overflow: hidden;
            }
            #canvas {
                flex: 1 0;
                height: 100%;
                background-color: #529e68; /* For visibility */
            }

            /* FAB Button */
            #fab-btn {
                position: fixed;
                bottom: 20px;
                right: 20px;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                background-color: rgba(100, 100, 100, 0.7);
                color: white;
                font-size: 24px;
                border: none;
                cursor: pointer;
                z-index: 1000;
                display: none;
                align-items: center;
                justify-content: center;
            }
            #fab-btn:hover {
                background-color: rgba(150, 150, 150, 0.9);
            }

            /* Logs Overlay Panel */
            #logs-panel {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: rgba(0, 0, 0, 0.85);
                z-index: 999;
                flex-direction: column;
            }
            #logs-panel.active {
                display: flex;
            }
            #logs-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                background-color: #333;
                color: white;
                border-bottom: 1px solid #555;
            }
            #logs-header h3 {
                margin: 0;
                font-size: 18px;
            }
            #close-logs-btn {
                background: none;
                border: none;
                color: white;
                font-size: 28px;
                cursor: pointer;
                padding: 0 10px;
            }
            #close-logs-btn:hover {
                color: #ff6666;
            }
            #logs-container {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
                font-family: 'Courier New', monospace;
                font-size: 12px;
                color: #0f0;
                background-color: #111;
            }
            #logs-container .log-line {
                margin-bottom: 4px;
                word-wrap: break-word;
                white-space: pre-wrap;
            }
            #logs-container .log-stdout {
                color: #0f0;
            }
            #logs-container .log-stderr {
                color: #ff6666;
            }
            #logs-container .log-status {
                color: #6699ff;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"
            oncontextmenu="event.preventDefault()"
            tabindex=-1></canvas>

        <script src="ads_config.js"></script>
        <script>
            // H5 Games Ad Placement needs a real publisher ID and a user gesture.
            // The Continue tap is the gesture; closing/skipping the ad returns
            // to the result or the retried round underneath.
            (function () {
                if (!window.BOWLING_ADSENSE_CLIENT) return;
                var housePromo = !!window.BOWLING_H5_HOUSE_PROMO && !window.BOWLING_ADS_TEST;
                // The live house promo is an in-game activity, not an AdSense
                // impression. Do not load Google's ad script in this mode.
                window.bowlingH5AdsReady = false;
                if (!housePromo) {
                    window.adsbygoogle = window.adsbygoogle || [];
                    window.adBreak = window.adConfig = function (request) {
                        window.adsbygoogle.push(request);
                    };
                    // The reward card can appear before Google finishes preload.
                    window.adConfig({
                        preloadAdBreaks: 'on',
                        onReady: function () { window.bowlingH5AdsReady = true; }
                    });
                    var tag = document.createElement('script');
                    tag.async = true;
                    tag.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' +
                        encodeURIComponent(window.BOWLING_ADSENSE_CLIENT);
                    tag.crossOrigin = 'anonymous';
                    tag.dataset.adClient = window.BOWLING_ADSENSE_CLIENT;
                    tag.dataset.adFrequencyHint = window.BOWLING_AD_FREQUENCY_HINT;
                    if (window.BOWLING_ADS_TEST) tag.dataset.adbreakTest = 'on';
                    document.head.appendChild(tag);
                }

                // Localhost preview follows the game's real ad placement and
                // credit rules, but does not depend on H5 approval or ad fill.
                // ?googleMockAds=1 keeps Google's alternating H5 test ads
                // available for integration checks.
                var localAdPreview = window.BOWLING_ADS_TEST &&
                    !new URLSearchParams(window.location.search).has('googleMockAds');
                var useInGamePromo = housePromo || localAdPreview;
                function showInGamePromo(rewarded, done) {
                    var overlay = document.createElement('div');
                    overlay.id = 'in-game-promo';
                    overlay.style.cssText = 'position:fixed;inset:0;z-index:2001;background:#0c1020;color:white;display:flex;align-items:center;justify-content:center;font:20px sans-serif';
                    var panel = document.createElement('div');
                    panel.style.cssText = 'width:min(88vw,480px);padding:24px;border:2px solid #e8b83a;border-radius:20px;background:linear-gradient(145deg,#493067,#202b55);text-align:center;box-shadow:0 20px 80px #000a';
                    var heading = document.createElement('div');
                    heading.textContent = housePromo ? 'IN-GAME PROMO' : 'LOCAL AD PREVIEW';
                    heading.style.cssText = 'font:700 15px sans-serif;letter-spacing:3px;color:#ffe088';
                    panel.appendChild(heading);
                    var creative = document.createElement('div');
                    creative.textContent = rewarded
                        ? 'Discover your next ball · Earn $' + window.BOWLING_MONEY_REWARD
                        : 'Ready for another round?';
                    creative.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:220px;margin:22px 0;border-radius:16px;background:linear-gradient(135deg,#ed638c,#dfaf35);font:700 32px sans-serif;text-shadow:0 2px 5px #0007';
                    panel.appendChild(creative);
                    var disclosure = document.createElement('div');
                    disclosure.textContent = housePromo
                        ? 'A promotion for this game. No paid ad is shown.'
                        : 'Local ad preview · no paid ad is shown.';
                    disclosure.style.cssText = 'font:14px sans-serif;color:#ddd';
                    panel.appendChild(disclosure);
                    var status = document.createElement('div');
                    status.style.cssText = 'margin:12px 0;color:#eee';
                    panel.appendChild(status);
                    var progressTrack = document.createElement('div');
                    progressTrack.style.cssText = 'height:8px;border-radius:8px;background:#ffffff44;overflow:hidden;margin:12px 0 20px';
                    var progressFill = document.createElement('div');
                    progressFill.style.cssText = 'width:0;height:100%;background:#ffe088;transition:width .3s';
                    progressTrack.appendChild(progressFill);
                    panel.appendChild(progressTrack);
                    var controls = document.createElement('div');
                    controls.style.cssText = 'display:flex;justify-content:center;gap:12px';
                    var finishButton = document.createElement('button');
                    finishButton.disabled = true;
                    finishButton.style.cssText = 'padding:14px 24px;border:0;border-radius:10px;background:#e8b83a;color:#281b00;font:700 18px sans-serif';
                    controls.appendChild(finishButton);
                    if (rewarded) {
                        var skipButton = document.createElement('button');
                        skipButton.textContent = 'Skip (no reward)';
                        skipButton.style.cssText = 'padding:14px 18px;border:1px solid #fff8;border-radius:10px;background:transparent;color:white;font:17px sans-serif';
                        controls.appendChild(skipButton);
                    }
                    panel.appendChild(controls);
                    overlay.appendChild(panel);
                    document.body.appendChild(overlay);
                    var audioContext = window.Module && Module.SDL2 && Module.SDL2.audioContext;
                    var resumeAudio = audioContext && audioContext.state === 'running';
                    if (resumeAudio) audioContext.suspend().catch(function () {});
                    var duration = rewarded ? 6 : 4;
                    var remaining = duration;
                    var finished = false;
                    function finish(earned) {
                        if (finished) return;
                        finished = true;
                        clearInterval(timer);
                        overlay.remove();
                        if (resumeAudio && audioContext.state === 'suspended')
                            audioContext.resume().catch(function () {});
                        done(earned);
                    }
                    function update() {
                        progressFill.style.width = ((duration - remaining) * 100 / duration) + '%';
                        status.textContent = remaining > 0
                            ? (rewarded ? 'Reward available in ' : 'Close available in ') + remaining + 's'
                            : (rewarded ? 'Promo complete — collect your reward' : 'Promo complete');
                        finishButton.textContent = remaining > 0
                            ? 'Please wait' : (rewarded ? 'Collect $' + window.BOWLING_MONEY_REWARD : 'Continue');
                        finishButton.disabled = remaining > 0;
                    }
                    finishButton.addEventListener('click', function () { finish(rewarded); });
                    if (skipButton) skipButton.addEventListener('click', function () { finish(false); });
                    update();
                    var timer = setInterval(function () {
                        if (document.visibilityState === 'hidden') return;
                        remaining = Math.max(0, remaining - 1);
                        update();
                    }, 1000);
                }

                window.bowlingShowGameAd = function (placement, prompt, continueLabel) {
                    if (document.getElementById('loss-ad-overlay')) {
                        window.bowlingInterstitialFinishedCount = (window.bowlingInterstitialFinishedCount | 0) + 1;
                        return;
                    }
                    var overlay = document.createElement('div');
                    overlay.id = 'loss-ad-overlay';
                    overlay.style.cssText = 'position:fixed;inset:0;z-index:2000;background:#111d;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;box-sizing:border-box;cursor:pointer;text-align:center';
                    overlay.tabIndex = 0;
                    overlay.setAttribute('role', 'button');
                    var heading = document.createElement('div');
                    heading.textContent = prompt || 'A word from our sponsors';
                    heading.style.cssText = 'font:600 clamp(22px,5vw,32px) sans-serif;max-width:90vw';
                    overlay.appendChild(heading);
                    // This is a visual cue; the full overlay is the tap target.
                    var actionCue = document.createElement('div');
                    actionCue.textContent = continueLabel || 'Continue to ad';
                    actionCue.style.cssText = 'font:700 clamp(18px,4vw,24px) sans-serif;padding:18px 36px;border-radius:12px;background:#2bc86f;color:#092818;box-shadow:0 5px 0 #157c42;max-width:calc(100vw - 48px);box-sizing:border-box';
                    overlay.appendChild(actionCue);
                    document.body.appendChild(overlay);
                    var opening = false;
                    function openAd() {
                        if (opening) return;
                        opening = true;
                        if (useInGamePromo) {
                            showInGamePromo(false, function () {
                                overlay.remove();
                                window.bowlingInterstitialShownCount = (window.bowlingInterstitialShownCount | 0) + 1;
                                window.bowlingInterstitialFinishedCount = (window.bowlingInterstitialFinishedCount | 0) + 1;
                            });
                            return;
                        }
                        var finished = false;
                        var timeout;
                        var adAudioContext = null;
                        function finish() {
                            if (finished) return;
                            finished = true;
                            clearTimeout(timeout);
                            overlay.remove();
                            window.bowlingInterstitialFinishedCount = (window.bowlingInterstitialFinishedCount | 0) + 1;
                            if (adAudioContext && adAudioContext.state === 'suspended')
                                adAudioContext.resume().catch(function () {});
                        }
                        // An ad blocker or unavailable network must not trap the player.
                        timeout = setTimeout(finish, 5000);
                        try {
                            window.adBreak({
                                type: 'next', name: 'after-' + placement,
                                beforeAd: function () {
                                    overlay.style.display = 'none';
                                    clearTimeout(timeout);
                                    timeout = setTimeout(finish, 120000);
                                    adAudioContext = window.Module && Module.SDL2 && Module.SDL2.audioContext;
                                    if (adAudioContext) adAudioContext.suspend().catch(function () {});
                                },
                                adBreakDone: function (info) {
                                    if (info && info.breakStatus === 'viewed')
                                        window.bowlingInterstitialShownCount = (window.bowlingInterstitialShownCount | 0) + 1;
                                    finish();
                                }
                            });
                        } catch (error) {
                            console.warn('Game ad unavailable:', error);
                            finish();
                        }
                    }
                    overlay.addEventListener('click', openAd);
                    overlay.addEventListener('keydown', function (event) {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            openAd();
                        }
                    });
                    overlay.focus();
                };

                window.bowlingShowMoneyRewardAd = function () {
                    if (useInGamePromo) {
                        showInGamePromo(true, function (earned) {
                            window.bowlingMoneyRewardLastStatus = (housePromo ? 'house-promo-' : 'preview-') +
                                (earned ? 'viewed' : 'skipped');
                            if (earned)
                                window.bowlingMoneyRewardEarnedCount = (window.bowlingMoneyRewardEarnedCount | 0) + 1;
                            window.bowlingMoneyRewardFinishedCount = (window.bowlingMoneyRewardFinishedCount | 0) + 1;
                        });
                        return;
                    }
                    var overlay = null;
                    var earned = false;
                    var finished = false;
                    var adAudioContext = null;
                    var timeout = setTimeout(finish, 15000);
                    function finish() {
                        if (finished) return;
                        finished = true;
                        clearTimeout(timeout);
                        if (overlay) overlay.remove();
                        if (adAudioContext && adAudioContext.state === 'suspended')
                            adAudioContext.resume().catch(function () {});
                        if (earned)
                            window.bowlingMoneyRewardEarnedCount = (window.bowlingMoneyRewardEarnedCount | 0) + 1;
                        window.bowlingMoneyRewardFinishedCount = (window.bowlingMoneyRewardFinishedCount | 0) + 1;
                    }
                    try {
                        window.adBreak({
                            type: 'reward', name: 'shop-' + window.BOWLING_MONEY_REWARD + '-coins',
                            beforeReward: function (showAdFn) {
                                if (finished) return;
                                // H5 requires showAdFn from a direct user gesture.
                                clearTimeout(timeout);
                                timeout = setTimeout(finish, 120000);
                                overlay = document.createElement('div');
                                overlay.style.cssText = 'position:fixed;inset:0;z-index:2000;background:#111b;display:flex;align-items:center;justify-content:center';
                                var button = document.createElement('button');
                                button.textContent = '▶ $' + window.BOWLING_MONEY_REWARD;
                                button.style.cssText = 'font:700 28px sans-serif;padding:22px 52px;border:0;border-radius:14px;background:#e8b83a;color:#281b00';
                                overlay.appendChild(button);
                                var cancel = document.createElement('button');
                                cancel.textContent = '×';
                                cancel.setAttribute('aria-label', 'Close');
                                cancel.style.cssText = 'position:absolute;top:24px;right:24px;font:32px sans-serif;border:0;background:transparent;color:white';
                                cancel.addEventListener('click', finish);
                                overlay.appendChild(cancel);
                                document.body.appendChild(overlay);
                                button.addEventListener('click', function () {
                                    button.disabled = true;
                                    showAdFn();
                                }, {once: true});
                            },
                            beforeAd: function () {
                                clearTimeout(timeout);
                                timeout = setTimeout(finish, 600000);
                                if (overlay) overlay.style.display = 'none';
                                adAudioContext = window.Module && Module.SDL2 && Module.SDL2.audioContext;
                                if (adAudioContext) adAudioContext.suspend().catch(function () {});
                            },
                            adViewed: function () { earned = true; },
                            adBreakDone: function (info) {
                                var status = info && info.breakStatus || 'unknown';
                                window.bowlingMoneyRewardLastStatus = status;
                                if (status === 'viewed') earned = true;
                                if (status !== 'viewed') {
                                    var message = 'Money reward ad not awarded: ' + status;
                                    if (window.Module && Module.printErr) Module.printErr(message);
                                    else console.info(message);
                                }
                                finish();
                            }
                        });
                    } catch (error) {
                        console.warn('Money reward ad unavailable:', error);
                        finish();
                    }
                };
            })();
        </script>

        <!-- FAB Button -->
        <button id="fab-btn" title="Open Logs">📋</button>

        <!-- Logs Overlay Panel -->
        <div id="logs-panel">
            <div id="logs-header">
                <h3>📜 Console Logs</h3>
                <button id="close-logs-btn">&times;</button>
            </div>
            <div id="logs-container"></div>
        </div>

        <script type='text/javascript'>
            var logsContainer = document.getElementById('logs-container');
            var logsPanel = document.getElementById('logs-panel');
            var fabBtn = document.getElementById('fab-btn');
            var closeLogsBtn = document.getElementById('close-logs-btn');

            window.setPerfLogFabVisible = function(enabled) {
                fabBtn.style.display = enabled ? 'flex' : 'none';
                if (!enabled)
                    logsPanel.classList.remove('active');
            };

            // Toggle logs panel
            fabBtn.addEventListener('click', function() {
                logsPanel.classList.toggle('active');
            });

            closeLogsBtn.addEventListener('click', function() {
                logsPanel.classList.remove('active');
            });

            // Helper to add log line
            function addLog(message, type) {
                var line = document.createElement('div');
                line.className = 'log-line ' + type;
                line.textContent = message;
                logsContainer.appendChild(line);
                // Keep long sessions from growing the DOM without a limit.
                while (logsContainer.childElementCount > 300)
                    logsContainer.removeChild(logsContainer.firstElementChild);
                // Auto-scroll to bottom
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }

            var Module = {
                print: (args) => {
                    console.log("STDOUT: " + args);
                    addLog(args, 'log-stdout');
                },
                printErr: (args) => {
                    console.warn("STDERR: " + args);
                    addLog(args, 'log-stderr');
                },
                canvas: document.getElementById('canvas'),
                setStatus: (text) => {
                    console.log("STATUS: " + text);
                    addLog(text, 'log-status');
                },
            }
            window.onerror = function(message, source, lineno, colno, error) {
                var errorMsg = "ERROR: " + message + " (line " + lineno + ", col " + colno + ")";
                console.error(errorMsg);
                addLog(errorMsg, 'log-stderr');
            }
        </script>


        <script>
            (function () {
                var overlayState = {};

                function removeOverlay(name) {
                    var existing = overlayState[name];
                    if (existing && existing.parentNode) {
                        existing.parentNode.removeChild(existing);
                    }
                    delete overlayState[name];
                }

                // Assumed signature for future customization:
                //   showGameOverlay(name, {
                //     title: 'Title text',
                //     text: 'Message body',
                //     buttons: [{ label, onClick }]
                //   })
                window.showGameOverlay = function (name, options) {
                    if (!name)
                        return;
                    removeOverlay(name);

                    options = options || {};

                    var overlay = document.createElement('div');
                    overlay.id = 'game-overlay-' + name;
                    overlay.style.cssText =
                        'position:fixed;left:0;top:0;right:0;bottom:0;' +
                        'display:flex;align-items:center;justify-content:center;' +
                        'background:rgba(0,0,0,0.62);z-index:2147483647;' +
                        'font-family:sans-serif;';

                    var panel = document.createElement('div');
                    panel.style.cssText =
                        'width:min(88vw,420px);padding:22px 20px 18px;border-radius:18px;' +
                        'background:#1e2436;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,0.45);' +
                        'text-align:center;';

                    if (options.title) {
                        var title = document.createElement('div');
                        title.textContent = options.title;
                        title.style.cssText = 'font-size:22px;font-weight:700;margin-bottom:12px;';
                        panel.appendChild(title);
                    }

                    if (options.text) {
                        var text = document.createElement('div');
                        text.textContent = options.text;
                        text.style.cssText = 'font-size:16px;line-height:1.45;margin-bottom:18px;color:rgba(255,255,255,0.9);';
                        panel.appendChild(text);
                    }

                    var buttonsRow = document.createElement('div');
                    buttonsRow.style.cssText = 'display:flex;gap:12px;justify-content:center;flex-wrap:wrap;';

                    var buttons = Array.isArray(options.buttons) ? options.buttons : [];
                    buttons.forEach(function (btnDef, index) {
                        var button = document.createElement('button');
                        button.type = 'button';
                        button.textContent = btnDef && btnDef.label ? btnDef.label : ('Button ' + (index + 1));
                        button.style.cssText =
                            'min-width:110px;padding:12px 18px;border:0;border-radius:12px;' +
                            'font-size:16px;font-weight:700;cursor:pointer;';
                        if (btnDef && btnDef.kind === 'primary') {
                            button.style.background = '#5d7cff';
                            button.style.color = '#fff';
                        } else if (btnDef && btnDef.kind === 'danger') {
                            button.style.background = '#c43c3c';
                            button.style.color = '#fff';
                        } else {
                            button.style.background = '#d9dde7';
                            button.style.color = '#1a1f2d';
                        }
                        button.onclick = function () {
                            if (btnDef && typeof btnDef.onClick === 'function') {
                                btnDef.onClick();
                            }
                            if (!btnDef || btnDef.closeOnClick !== false) {
                                removeOverlay(name);
                            }
                        };
                        buttonsRow.appendChild(button);
                    });

                    panel.appendChild(buttonsRow);
                    overlay.appendChild(panel);
                    document.body.appendChild(overlay);
                    overlayState[name] = overlay;
                    return overlay;
                };

                window.hideGameOverlay = function (name) {
                    removeOverlay(name);
                };

                window.__updatePromptState = {
                    visible: false,
                    dismissed: false,
                    reloadOnControllerChange: false,
                    registration: null
                };

                function showUpdatePrompt() {
                    var state = window.__updatePromptState;
                    if (state.dismissed || state.visible)
                        return;
                    if (!state.registration || !state.registration.waiting)
                        return;
                    if (!navigator.serviceWorker.controller)
                        return;

                    state.visible = true;
                    window.showGameOverlay('update-prompt', {
                        title: 'Update available',
                        text: 'A new version of the game is available. Update now?',
                        buttons: [
                            {
                                label: 'Update',
                                kind: 'primary',
                                onClick: function () {
                                    var waiting = state.registration && state.registration.waiting;
                                    if (waiting) {
                                        state.visible = false;
                                        window.hideGameOverlay('update-prompt');
                                        state.reloadOnControllerChange = true;
                                        waiting.postMessage({ type: 'SKIP_WAITING' });
                                    }
                                }
                            },
                            {
                                label: 'Dismiss',
                                onClick: function () {
                                    state.dismissed = true;
                                    state.visible = false;
                                    window.hideGameOverlay('update-prompt');
                                }
                            }
                        ]
                    });
                }

                function handleSWMessage(event) {
                    if (!event || !event.data || event.data.type !== 'NEW_VERSION_AVAILABLE')
                        return;
                    var state = window.__updatePromptState;
                    if (!state.registration && navigator.serviceWorker.controller)
                        state.registration = null;
                    showUpdatePrompt();
                }

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.addEventListener('message', handleSWMessage);
                    navigator.serviceWorker.addEventListener('controllerchange', function () {
                        var state = window.__updatePromptState;
                        if (state.reloadOnControllerChange) {
                            state.reloadOnControllerChange = false;
                            window.location.reload();
                        }
                    });

                    window.addEventListener('load', function () {
                        navigator.serviceWorker.register('sw.js').then(function (registration) {
                            window.__updatePromptState.registration = registration;

                            registration.addEventListener('updatefound', function () {
                                var installing = registration.installing;
                                if (!installing)
                                    return;
                                installing.addEventListener('statechange', function () {
                                    if (installing.state !== 'installed')
                                        return;
                                    if (!navigator.serviceWorker.controller)
                                        return;
                                    showUpdatePrompt();
                                });
                                if (installing.state === 'installed' && navigator.serviceWorker.controller)
                                    showUpdatePrompt();
                            });

                            if (registration.waiting && navigator.serviceWorker.controller) {
                                showUpdatePrompt();
                            }
                        }).catch(function (err) {
                            console.warn('Service worker registration failed:', err);
                        });
                    });
                }
            })();
        </script>
